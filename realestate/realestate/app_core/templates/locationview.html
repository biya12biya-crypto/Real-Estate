{% load static %}
{% include "Layout/Partials/Admin/header.html" %}
   <div class="row">
        <div class="col-lg-12 d-flex align-items-stretch">
            <div class="card w-100">
              <div class="card-body p-4">
                <h5 class="card-title fw-semibold mb-4">Location View</h5>
                <div class="table-responsive">
                  <table class="table text-nowrap mb-0 align-middle">
                    <thead class="text-dark fs-4">

                      <tr>
                        <th class="border-bottom-0">
                          <h6 class="fw-semibold mb-0">No</h6>
                        </th>
                        <th class="border-bottom-0">
                          <h6 class="fw-semibold mb-0">Location Name</h6>
                        </th>
                        <th class="border-bottom-0">
                          <h6 class="fw-semibold mb-0">District Name</h6>
                        </th>
                        <th class="border-bottom-0">
                          <h6 class="fw-semibold mb-0">Delete</h6>
                        </th>

                        <th class="border-bottom-0">
                          <h6 class="fw-semibold mb-0">Update</h6>
                        </th>
                      </tr>
                    </thead>
                    <tbody>
                         {% for i in locationview %}
                        <tr>
                            <td class="border-bottom-0"><h6 class="fw-semibold mb-0">{{ forloop.counter }}</h6></td>

                            <td><h6 class="fw-semibold mb-1">{{i.name}}</h6></td>
                            <td><h6 class="fw-semibold mb-1">{{i.dis.name}}</h6></td>
                            <td><a href="{% url 'core:deleteloc' i.id %}"><button type="submit" class="btn btn-danger">Delete</button></a></td>
                            <td>
  <a href="{% url 'core:locationup' i.id %}" class="btn btn-primary">
    Edit
  </a>
</td>

                            </td>
                        </tr>
                       {% endfor %}
                    </tbody>

                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
{% include "Layout/Partials/Admin/footer.html" %}
