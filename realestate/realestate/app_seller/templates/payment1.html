{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Select Plan - KeralaNest</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }

        /* ===== Header ===== */
        .header {
            background: #0d6efd;
            color: white;
            padding: 20px 0;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            color: #333;
        }

        .plan-class {
            padding: 40px 20px;
        }

        .plans {
            display: flex;
            gap: 25px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .plan-card {
            background: #fff;
            width: 300px;
            border-radius: 10px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .plan-card h2 {
            margin-bottom: 15px;
            color: #222;
        }

        .price {
            font-size: 28px;
            color: #28a745;
            margin: 15px 0;
        }

        .duration {
            color: #666;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background: #0d6efd;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .btn:hover {
            background: #084298;
        }

        /* Back link */
        .back-link {
            text-align: center;
            margin: 30px 0;
        }

        .back-link a {
            text-decoration: none;
            color: #0d6efd;
            font-weight: bold;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        /* ===== Footer ===== */
        .footer {
            background: #0d6efd;
            color: white;
            text-align: center;
            padding: 15px 0;
        }

    </style>
</head>

<body>

    <!-- Header -->
    <div class="header">
        KeralaNest Property Plans
    </div>

    <div id="home-section">

        <div class="plan-class">
            <h1>Select a Plan to Add Your Property</h1>

            <div class="plans">

                <!-- 3 Month Plan -->
                <div class="plan-card">
                    <h2>Basic Plan</h2>
                    <div class="price">₹999</div>
                    <div class="duration">3 Months</div>
                    <a href="{% url 'seller:payment2' 3 %}" class="btn">Choose Plan</a>
                </div>

                <!-- 6 Month Plan -->
                <div class="plan-card">
                    <h2>Standard Plan</h2>
                    <div class="price">₹1799</div>
                    <div class="duration">6 Months</div>
                    <a href="{% url 'seller:payment2' 6 %}" class="btn">Choose Plan</a>
                </div>

                <!-- 1 Year Plan -->
                <div class="plan-card">
                    <h2>Premium Plan</h2>
                    <div class="price">₹2999</div>
                    <div class="duration">1 Year</div>
                    <a href="{% url 'seller:payment2' 12 %}" class="btn">Choose Plan</a>
                </div>

            </div>
        </div>

    </div>

    <!-- Back to Login -->
    <div class="back-link">
        <a href="{% url 'dashboard:login' %}">← Back to Login</a>
    </div>

    <!-- Footer -->
    <div class="footer">
        © 2026 KeralaNest. All rights reserved.
    </div>

</body>
</html>
