{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Payment Confirmation - KeralaNest</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f8ff;
            margin: 0;
            padding: 0;
        }

        /* ===== HEADER ===== */
        .header {
            background: #0d6efd;
            color: white;
            text-align: center;
            padding: 18px 0;
            font-size: 22px;
            font-weight: bold;
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            max-width: 650px;
            margin: 60px auto;
            background: #ffffff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(13, 110, 253, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #0d6efd;
        }

        .summary {
            border: 1px solid #dbe5ff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            background: #f8fbff;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
            font-size: 16px;
        }

        .summary-row strong {
            color: #0d6efd;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
            color: #0d6efd;
        }

        /* FORM FIELDS */
        .form-label {
            font-weight: bold;
            color: #0d6efd;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #cfe2ff;
            margin-top: 5px;
        }

        .form-control:focus {
            border-color: #0d6efd;
            outline: none;
            box-shadow: 0 0 5px rgba(13,110,253,0.4);
        }

        .row {
            margin-bottom: 15px;
        }

        /* BUTTONS */
        .btn {
            padding: 12px 25px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        .btn-confirm {
            background: #0d6efd;
            color: #fff;
        }

        .btn-confirm:hover {
            background: #084298;
        }

        .btn-cancel {
            background: #6c757d;
            color: #fff;
        }

        .btn-cancel:hover {
            background: #565e64;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        /* BACK LINK */
        .back-link {
            text-align: center;
            margin: 30px 0;
        }

        .back-link a {
            text-decoration: none;
            color: #0d6efd;
            font-weight: bold;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        /* FOOTER */
        .footer {
            background: #0d6efd;
            color: white;
            text-align: center;
            padding: 15px 0;
            margin-top: 40px;
        }

    </style>
</head>

<body>

    <!-- HEADER -->
    <div class="header">
        KeralaNest Secure Payment
    </div>

    <div class="container">

        <h1>Confirm Your Payment</h1>

        <div class="summary">
            <div class="summary-row">
                <span><strong>Selected Plan:</strong></span>
                <span>{{ plan_name }}</span>
            </div>

            <div class="summary-row">
                <span><strong>Duration:</strong></span>
                <span>{{ plan_duration }}</span>
            </div>

            <div class="summary-row">
                <span><strong>Amount:</strong></span>
                <span>₹{{ amount }}</span>
            </div>

            <hr>

            <div class="summary-row total">
                <span>Total Payable</span>
                <span>₹{{ amount }}</span>
            </div>
        </div>

        <form method="post" action="{% url 'seller:payment2' plan %}">
            {% csrf_token %}

            <div class="row">
                <label class="form-label">Account Holder Name</label>
                <input type="text" name="name" class="form-control" required>
            </div>

            <div class="row">
                <label class="form-label">Account Number</label>
                <input type="text"
                       name="number"
                       class="form-control"
                       maxlength="16"
                       pattern="\d{16}"
                       placeholder="16 digit account number"
                       required>
            </div>

            <div class="row">
                <label class="form-label">Expiry Date</label>
                <input type="month"
                       name="exp"
                       id="expiry"
                       class="form-control"
                       required>
            </div>

            <div class="row">
                <label class="form-label">CVV</label>
                <input type="password"
                       name="cvv"
                       class="form-control"
                       maxlength="3"
                       pattern="\d{3}"
                       placeholder="***"
                       required>
            </div>

            <div class="button-group">
                <button type="submit" class="btn btn-confirm">
                    Confirm & Pay
                </button>

                <a href="{% url 'seller:payment1' %}" class="btn btn-cancel">
                    Cancel
                </a>
            </div>

        </form>

    </div>

    <!-- BACK TO LOGIN -->
    <div class="back-link">
        <a href="{% url 'dashboard:login' %}">← Back to Login</a>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        © 2026 KeralaNest. All rights reserved.
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const expiryInput = document.getElementById("expiry");
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, "0");
            expiryInput.min = `${year}-${month}`;
        });
    </script>

</body>
</html>
