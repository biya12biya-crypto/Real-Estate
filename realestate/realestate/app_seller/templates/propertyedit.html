{% load static %}
 {% include 'Layout/Partials/seller/header.html' %} 


<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-8">

<div class="card shadow">

<div class="card-header bg-primary text-white">
<h4 class="mb-0">Edit Property</h4>
</div>

<div class="card-body">

<form method="post" enctype="multipart/form-data" action="{% url 'propertyedit' property.id %}">
{% csrf_token %}

<div class="row">

<!-- Property Name -->
<div class="col-md-6 mb-3">
<label class="form-label">Property Name</label>
<input type="text" name="name" class="form-control" value="{{ property.name }}" required>
</div>

<!-- Location -->
<div class="col-md-6 mb-3">
<label class="form-label">Location URL</label>
<input type="text" name="location_url" class="form-control" value="{{ property.location_url }}" required>
</div>

<!-- Property Type -->
<div class="col-md-6 mb-3">
<label class="form-label">Property Type</label>
<select name="type" class="form-control" required>

<option value="">Select Type</option>

{% for i in list %}
<option value="{{ i.id }}" {% if property.type.id == i.id %}selected{% endif %}>
{{ i.name }}
</option>
{% endfor %}

</select>
</div>

<!-- Status -->
<div class="col-md-6 mb-3">
<label class="form-label">Status</label>
<select name="status" class="form-control" required>

<option value="Available" {% if property.status == "Available" %}selected{% endif %}>
Available
</option>

<option value="Not Available" {% if property.status == "Not Available" %}selected{% endif %}>
Not Available
</option>

</select>
</div>

<!-- Price -->
<div class="col-md-6 mb-3">
<label class="form-label">Price</label>
<input type="number" name="price" class="form-control" value="{{ property.price }}" required>
</div>

<!-- Description -->
<div class="col-md-12 mb-3">
<label class="form-label">Description</label>
<textarea name="description" class="form-control" rows="4" required>{{ property.description }}</textarea>
</div>

<!-- Image Upload -->
<div class="col-md-6 mb-3">
<label class="form-label">Add New Images</label>
<input type="file" name="img" class="form-control" multiple>
</div>

<!-- Document Upload -->
<div class="col-md-6 mb-3">
<label class="form-label">Add New Documents</label>
<input type="file" name="doc" class="form-control" multiple>
</div>

</div>

<button type="submit" class="btn btn-success w-100">
Update Property
</button>

</form>

</div>
</div>

</div>
</div>

</div>




{% include 'Layout/Partials/seller/footer.html' %}
