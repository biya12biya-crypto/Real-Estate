{% load static %}
{% include 'Layout/Partials/buyer/header.html' %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Property Price Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5 mb-5">
    <h2 class="text-center text-primary fw-bold mb-4">Property Price Prediction</h2>

    <form method="POST" action="{% url 'buyer:predict_house' %}">
        {% csrf_token %}
        <div class="row g-3">

            <!-- Property Type -->
            <div class="col-md-4">
                <label class="form-label">Property Type</label>
                <select class="form-select" name="property_type" required>
                    <option value="">Select</option>
                    <option value="Apartment">Apartment</option>
                    <option value="Villa">Villa</option>
                    <option value="House">House</option>
                </select>
            </div>

            <!-- Size -->
            <div class="col-md-4">
                <label class="form-label">Size (Sqft)</label>
                <input type="number" class="form-control" name="size_sqft" required>
            </div>

            <!-- BHK -->
            <div class="col-md-4">
                <label class="form-label">BHK</label>
                <input type="number" class="form-control" name="bhk" required>
            </div>

            <!-- Floor No -->
            <div class="col-md-4">
                <label class="form-label">Floor no</label>
                <input type="text" class="form-control" name="floor_no">
            </div>

            <!-- Total Floors -->
            <div class="col-md-4">
                <label class="form-label">Total Floors</label>
                <input type="number" class="form-control" name="total_floors">
            </div>

            <!-- Property Age -->
            <div class="col-md-4">
                <label class="form-label">Age of Property (Years)</label>
                <input type="number" class="form-control" name="property_age">
            </div>

            <!-- Furnished -->
            <div class="col-md-4">
                <label class="form-label">Furnished Status</label>
                <select class="form-select" name="furnished">
                    <option value="Furnished">Furnished</option>
                    <option value="Not Furnished">Not Furnished</option>
                </select>
            </div>

            <!-- Owner Type -->
            <div class="col-md-4">
                <label class="form-label">Owner Type</label>
                <select class="form-select" name="owner_type">
                    <option value="Owner">Owner</option>
                    <option value="Builder">Builder</option>
                    <option value="Agent">Agent</option>
                </select>
            </div>

            <!-- Facing -->
            <div class="col-md-4">
                <label class="form-label">Facing</label>
                <select class="form-select" name="facing">
                    <option value="North">North</option>
                    <option value="South">South</option>
                    <option value="East">East</option>
                    <option value="West">West</option>
                </select>
            </div>

            <!-- Availability -->
            <div class="col-md-4">
                <label class="form-label">Availability Status</label>
                <select class="form-select" name="availability">
                    <option value="Ready to Move">Ready to Move</option>
                    <option value="Under Construction">Under Construction</option>
                </select>
            </div>

            <!-- Public Transport -->
            <div class="col-md-4">
                <label class="form-label">Public Transport</label>
                <select class="form-select" name="public_transport">
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>
            </div>

            <!-- Parking -->
            <div class="col-md-4">
                <label class="form-label">Parking Space</label>
                <select class="form-select" name="parking">
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <!-- Security -->
            <div class="col-md-4">
                <label class="form-label">Security</label>
                <select class="form-select" name="security">
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <!-- State -->
            <div class="col-md-4">
                <label class="form-label">State and City</label>
                <input type="text" class="form-control" name="state_city">
            </div>


            <!-- Nearby Facilities -->
           <div class="col-md-6">
  <label class="form-label">Number of Schools and hospitals Nearby</label>
  <input type="number" class="form-control" name="sh_count" placeholder="e.g. 3" min="0">
</div>


            <!-- Amenities -->
            <div class="col-md-6">
                <label class="form-label">Amenities</label>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="garden">
                    <label class="form-check-label">Garden</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="playground">
                    <label class="form-check-label">Playground</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="clubhouse">
                    <label class="form-check-label">Clubhouse</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="gym">
                    <label class="form-check-label">Gym</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="pool">
                    <label class="form-check-label">Swimming Pool</label>
                </div>
            </div>

            <!-- Button -->
            <div class="col-12 text-center mt-4">
                <button type="submit" class="btn btn-success px-5 py-2">
                    Predict Price
                </button>
            </div>

        </div>
    </form>
    {% if predicted_price %}
<div class="row mt-5">
    <div class="col-12">
        <div class="alert alert-success text-center shadow-sm">
            <h4 class="mb-2">Estimated Property Price</h4>
            <h2 class="fw-bold text-dark">
                {{ predicted_price }}
            </h2>
        </div>
    </div>
</div>
{% endif %}
</div>

</body>
</html>
{% include 'Layout/Partials/buyer/footer.html' %}
