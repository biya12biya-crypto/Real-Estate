{% load static %}

{% include 'Layout/Partials/guest/header.html' %}

<div class="hero page-inner overlay" style="background-image: url('images/hero_bg_1.jpg')">
  <div class="container">
    <div class="row justify-content-center align-items-center">
      <div class="col-lg-9 text-center mt-5">
        <h1 class="heading" data-aos="fade-up">KeralaNest</h1>

        <nav aria-label="breadcrumb" data-aos="fade-up" data-aos-delay="200">
          <ol class="breadcrumb text-center justify-content-center">
            <li class="breadcrumb-item"><a href="index.html">Home</a></li>
            <li class="breadcrumb-item active text-white-50" aria-current="page">
              Contact
            </li>
          </ol>
        </nav>
      </div>
    </div>
  </div>
</div>

<div class="section">
  <div class="container">
    <div class="row">
      <h3 class="text-center">Login</h3>
      <div class="col-lg-2" data-aos="fade-up" data-aos-delay="200"></div>
      
      <div class="col-lg-8" data-aos="fade-up" data-aos-delay="200">
        <form method="POST" action="{% url 'dashboard:login' %}">
          {% csrf_token %} 
          <div class="row">
            
            <div class="col-12 mb-3">
              <input type="text" class="form-control" placeholder="Username" name="username" />
            </div>
           <div class="col-12 mb-3">
              <input type="password" class="form-control" placeholder="password" name="password" />
            </div>

             
            <div class="text-center mt-4">
             
                <button type="submit" class="btn btn-success px-5 py-2">
                Login
              </button>
               <a href="{% url 'dashboard:forget' %}" class="text-decoration-none">
      Forgot password?
    </a>
            </div>

          <div class="mt-3 text-center">
             Don't have an account?
         
          <div class="mt-3 text-center">
             
             <a href="{% url 'dashboard:register' %}">Sign up</a>
           </div>

          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% include 'Layout/Partials/guest/footer.html' %}
