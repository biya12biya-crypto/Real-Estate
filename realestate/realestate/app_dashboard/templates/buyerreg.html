{% load static %}

{% include 'Layout/Partials/guest/header.html' %}

  <div class="page-wrapper" id="main-wrapper">
    <div class="position-relative overflow-hidden text-bg-light min-vh-100 d-flex align-items-center justify-content-center">
      <div class="row justify-content-center w-100">
        <div class="col-md-8 col-lg-6 col-xxl-4">
          <div class="card mb-0">
            <div class="card-body">
              <div class="text-center py-3">
                <h3 class="text-primary">Buyer Registration</h3>
                <p class="text-muted">Create your Buyer Account</p>
              </div>

              <form method="POST" action="{% url 'dashboard:buyerreg' %}">
          {% csrf_token %} 
                <div class="text-center py-3">
  <h1 class="text-primary fw-bold">BUYER REGISTRATION</h1>
  <p class="text-muted">Create your Buyer Account</p>
</div>

                <!-- Username -->
                <div class="mb-3">
                  <label class="form-label">Username</label>
                     <input class="form-control" name="username" type="text" 
placeholder="Enter Username" 
                                    required minlength="8" title="Username must be at least 8 characters 
long.">
                </div>
                <!-- name -->
                <div class="mb-3">
                  <label class="form-label">Name</label>
                    <input class="form-control" name="name" type="text" 
placeholder="Enter Name" required  pattern="^[A-Z][a-zA-Z\s]*$" 
                                   title="Name must start with a capital letter and contain only letters.">
                </div>

                <!-- Email -->
                <div class="mb-3">
                  <label class="form-label">Email</label>
                    <input class="form-control" name="email" type="email" 
placeholder="Enter Email"required> 
                </div>

                <!-- Password -->
                <div class="mb-3">
                  <label class="form-label">Password</label>
                 <input class="form-control" name="password" type="password" 
placeholder="Enter Password"                                     required minlength="8" 
title="Password must be at least 8 characters long."> 
                </div>

                <!-- Phone -->
                <div class="mb-3">
                  <label class="form-label">Phone Number</label>
                   <input class="form-control" name="contact" type="text" 
placeholder="Enter Contact"  required pattern="[0-9]{10}" title="Please enter a valid 10
digit mobile number"> 
                </div>

                <!-- Address -->
                <div class="mb-4">
                  <label class="form-label">Address</label>
                  <textarea name="address" class="form-control" rows="3" placeholder="Enter address" required></textarea>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn btn-primary w-100 py-2 fs-5 rounded-2">
                  Register
                </button>

                <div class="text-center mt-3">
                  <p class="mb-0">
                    Already have an account?
                    <a href="login.html" class="text-primary fw-bold">Sign In</a>
                  </p>
                </div>
              </form>

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>



{% include 'Layout/Partials/guest/footer.html' %}
