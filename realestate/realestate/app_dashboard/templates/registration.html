{% load static %}

{% include 'Layout/Partials/guest/header.html' %}

<div class="page-wrapper" id="main-wrapper">
    <div
        class="position-relative overflow-hidden text-bg-light min-vh-100 d-flex align-items-center justify-content-center">
        <div class="row justify-content-center w-100">
            <div class="col-md-8 col-lg-6 col-xxl-4">
                <div class="card mb-0">
                    <div class="card-body">
                        <div class="text-center py-3">
                            <h3 class="text-primary">User Registration</h3>
                            <p class="text-muted">Create your KeralaNest Account</p>
                        </div>

                        <form method="POST" action="{% url 'dashboard:register' %}">
                            {% csrf_token %}
                            <div class="text-center py-3">
                                <h1 class="text-primary fw-bold">JOIN KERALANEST</h1>
                                <p class="text-muted">Register as a Buyer, Seller, or Both</p>
                            </div>
                            <div class="row">
    <div class="col-md-6">

                            <!-- Role Selection -->
                            <div class="mb-4">
                                <label class="form-label fw-bold">Select Your Role</label>
                                <div class="d-flex justify-content-around bg-light p-3 rounded">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="role_select" id="role_buyer"
                                            value="buyer" checked>
                                        <label class="form-check-label" for="role_buyer">Buyer</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="role_select" id="role_seller"
                                            value="seller">
                                        <label class="form-check-label" for="role_seller">Seller</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="role_select" id="role_both"
                                            value="both">
                                        <label class="form-check-label" for="role_both">Both</label>
                                    </div>
                                </div>
                            </div>
                            </div>
                                <div class="col-md-6">
                                    <!-- Username -->
                                    <div class="mb-3">
                                        <label class="form-label">Username</label>
                                        <input type="text" name="username" class="form-control"
                                            placeholder="Enter username" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <!-- name -->
                                    <div class="mb-3">
                                        <label class="form-label">Full Name</label>
                                        <input type="text" name="name" class="form-control"
                                            placeholder="Enter your full name" required>
                                    </div>
                                </div>



                                <div class="col-md-6">

                                    <!-- Email -->
                                    <div class="mb-3">
                                        <label class="form-label">Email</label>
                                        <input type="email" name="email" class="form-control" placeholder="Enter email"
                                            required>
                                    </div>
                                </div>
                                <div class="col-md-6">


                                    <!-- Password -->
                                    <div class="mb-3">
                                        <label class="form-label">Password</label>
                                        <input type="password" name="password" class="form-control"
                                            placeholder="Enter password" required>
                                    </div>
                                </div>
                                    <div class="col-md-6">

                                <!-- Phone -->
                                <div class="mb-3">
                                    <label class="form-label">Phone Number</label>
                                    <input type="text" name="contact" class="form-control"
                                        placeholder="Enter phone number" required>
                                </div>
</div>
                                <!-- Address -->
                                <div class="mb-4">
                                    <label class="form-label">Address</label>
                                    <textarea name="address" class="form-control" rows="3" placeholder="Enter address"
                                        required></textarea>
                                </div>

                                <!-- Submit -->
                                <button type="submit" class="btn btn-primary w-100 py-2 fs-5 rounded-2">
                                    Register
                                </button>

                                <div class="text-center mt-3">
                                    <p class="mb-0">
                                        Already have an account?
                                        <a href="{% url 'dashboard:login' %}" class="text-primary fw-bold">Sign In</a>
                                    </p>
                                </div>
                                </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% include 'Layout/Partials/guest/footer.html' %}
